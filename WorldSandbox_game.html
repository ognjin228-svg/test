<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Песочница миров</title>
<style>
:root{--bg:#191919;--surf:#202020;--raised:#383836;--txt:#fff;--sec:rgba(255,255,255,.65);--bd:rgba(255,255,255,.2);--acc:#5E9FE8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
#app{display:flex;height:100%}
#side{width:240px;flex:none;background:var(--surf);border-right:1px solid var(--bd);padding:16px;display:flex;flex-direction:column;gap:20px;overflow-y:auto}
h1{font-size:18px;margin:0}
.sub{color:var(--sec);font-size:12px;margin-top:4px}
.gt{font-size:11px;color:var(--sec);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tool{height:44px;border:1px solid transparent;background:var(--raised);border-radius:8px;font-size:20px;cursor:pointer;color:var(--txt);display:flex;align-items:center;justify-content:center;padding:0}
.tool:hover{border-color:var(--bd)}
.tool.active{border-color:var(--acc);background:rgba(94,159,232,.22)}
.tool:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#toolName{font-size:13px;color:var(--sec);margin-top:8px;min-height:36px}
.row{display:flex;gap:6px}
.btn{flex:1;height:36px;border-radius:8px;border:1px solid var(--bd);background:transparent;color:var(--txt);cursor:pointer;font:inherit;font-size:13px;padding:0 6px}
.btn:hover{background:var(--raised)}
.btn.active{background:var(--acc);border-color:var(--acc)}
input[type=range]{width:100%;accent-color:var(--acc)}
.stat{display:flex;align-items:center;padding:4px 0;font-size:13px}
.stat .n{margin-left:auto;font-variant-numeric:tabular-nums}
.stat .h{width:52px;text-align:right;color:var(--sec);font-variant-numeric:tabular-nums}
.dot{width:10px;height:10px;border-radius:2px;margin-right:8px;flex:none}
#wars{font-size:13px;color:var(--sec);line-height:1.6}
#main{flex:1;position:relative;min-width:0;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;cursor:none;touch-action:none}
#log{position:absolute;left:16px;bottom:16px;display:flex;flex-direction:column;gap:4px;pointer-events:none;max-width:70%}
#log div{background:rgba(25,25,25,.85);border:1px solid var(--bd);padding:4px 10px;border-radius:6px;font-size:13px;animation:fade 7s forwards;width:fit-content}
@keyframes fade{0%,80%{opacity:1}100%{opacity:0}}
#year{position:absolute;right:16px;top:16px;background:rgba(25,25,25,.85);border:1px solid var(--bd);padding:6px 12px;border-radius:8px;font-size:13px;pointer-events:none}
@media (max-width:700px){
 #app{flex-direction:column-reverse}
 #side{width:100%;height:44%;border-right:0;border-top:1px solid var(--bd);padding:12px;gap:14px}
 .tools{grid-template-columns:repeat(7,1fr)}
}
@media (prefers-reduced-motion:reduce){#log div{animation:none}}
</style>
</head>
<body>
<div id="app">
 <aside id="side">
  <div><h1>🌍 Песочница миров</h1><div class="sub">Создай мир и наблюдай, как живут народы</div></div>
  <div>
   <div class="gt">Силы бога</div>
   <div class="tools" id="tools"></div>
   <div id="toolName"></div>
  </div>
  <div>
   <div class="gt">Размер кисти: <span id="bsv">3</span></div>
   <input type="range" id="brush" min="1" max="20" value="3" aria-label="Размер кисти">
  </div>
  <div>
   <div class="gt">Время</div>
   <div class="row" id="speeds">
    <button class="btn" data-s="0" title="Пробел">⏸</button>
    <button class="btn active" data-s="1">1×</button>
    <button class="btn" data-s="2">2×</button>
    <button class="btn" data-s="3">5×</button>
   </div>
  </div>
  <div>
   <div class="gt">Народы</div>
   <div id="stats"></div>
  </div>
  <div>
   <div class="gt">Дипломатия</div>
   <div id="wars"></div>
  </div>
  <div><div class="gt">Управление</div><div style="font-size:13px;line-height:1.6;color:var(--muted,#9b9a97)">Колесо мыши или +/− — масштаб<br>Правая кнопка или WASD — двигать карту<br>Мини-карта — быстрый переход<br>Пробел — пауза</div></div>
  <button class="btn" id="newWorld" style="flex:none">🔄 Новый мир</button>
 </aside>
 <main id="main">
  <canvas id="c"></canvas>
  <div id="year">Год 0</div>
  <div id="log"></div>
 </main>
</div>
<script>
"use strict";
const W=480,H=300,N=W*H;
const DEEP=0,WATER=1,SAND=2,GRASS=3,FOREST=4,HILL=5,SNOW=6,LAVA=7,BURNT=8;
const hgt=new Float32Array(N),type=new Uint8Array(N),owner=new Int8Array(N),fire=new Uint8Array(N),lavaT=new Int16Array(N),shade=new Float32Array(N);
const RACES=[
 {name:'Люди',acc:'людям',icon:'🧑',col:[76,143,232],hp:30,dmg:5,age:2400,civ:true},
 {name:'Эльфы',acc:'эльфам',icon:'🧝',col:[96,214,128],hp:26,dmg:6,age:3600,civ:true,forest:true},
 {name:'Орки',acc:'оркам',icon:'👹',col:[228,80,70],hp:42,dmg:7,age:2000,civ:true},
 {name:'Гномы',acc:'гномам',icon:'⛏️',col:[236,176,60],hp:36,dmg:6,age:3000,civ:true,hills:true},
 {name:'Овцы',icon:'🐑',col:[245,245,245],hp:10,dmg:0,age:1600,civ:false},
];
const TOOLS=[
 {id:'raise',icon:'⛰️',name:'Поднять сушу — зажми и веди'},
 {id:'lower',icon:'🌊',name:'Опустить сушу, создать воду'},
 {id:'forest',icon:'🌲',name:'Посадить лес'},
 {id:'rain',icon:'🌧️',name:'Дождь: тушит огонь, оживляет землю'},
 {id:'r0',icon:'🧑',name:'Люди — строят деревни'},
 {id:'r1',icon:'🧝',name:'Эльфы — любят леса'},
 {id:'r2',icon:'👹',name:'Орки — сильные и воинственные'},
 {id:'r3',icon:'⛏️',name:'Гномы — могут жить в горах'},
 {id:'r4',icon:'🐑',name:'Овцы — плодятся на траве'},
 {id:'fire',icon:'🔥',name:'Огонь — сжигает лес и дома'},
 {id:'bolt',icon:'⚡',name:'Молния'},
 {id:'meteor',icon:'☄️',name:'Метеорит — кратер и лава'},
 {id:'kill',icon:'💀',name:'Кара — убивает существ'},
 {id:'peace',icon:'🕊️',name:'Мир во всём мире (клик по карте)'},
];
let tool='r0',brush=3,speed=1,tickN=0,acc=0;
let units=[];const MAXU=9000;const head=new Int32Array(N);const nxt=new Int32Array(MAXU*2);
const pop=[0,0,0,0,0],houses=[0,0,0,0,0];let prevPop=[0,0,0,0,0];
let war=new Uint8Array(16);
let effects=[];

function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function makeNoise(r){const G=new Float32Array(256*256);for(let i=0;i<G.length;i++)G[i]=r();return(x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;const x0=xi&255,x1=(xi+1)&255,y0=(yi&255)*256,y1=((yi+1)&255)*256;const a=G[y0+x0],b=G[y0+x1],c=G[y1+x0],d=G[y1+x1];const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}}
function fbm(n,x,y){let s=0,a=.5,f=1;for(let o=0;o<5;o++){s+=a*n(x*f,y*f);a*=.5;f*=2}return s/.96875}
function classify(h){return h<.38?DEEP:h<.45?WATER:h<.48?SAND:h<.66?GRASS:h<.76?HILL:SNOW}

function genWorld(){
 const r=rng(Math.random()*1e9|0),n=makeNoise(r),n2=makeNoise(r);
 const offx=r()*100,offy=r()*100;
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  const i=y*W+x;
  const dx=(x/W-.5)*2,dy=(y/H-.5)*2,d=dx*dx+dy*dy;
  let e=fbm(n,x/70+offx,y/70+offy)*.8+fbm(n,x/20+offx+50,y/20+offy+50)*.3+.1-d*d*.55;
  hgt[i]=e;let t=classify(e);
  if(t===GRASS&&fbm(n2,x/24,y/24)>.53)t=FOREST;
  type[i]=t;owner[i]=-1;fire[i]=0;lavaT[i]=0;shade[i]=.94+r()*.08;
 }
 units=[];tickN=0;effects=[];war.fill(0);
 for(let a=0;a<4;a++){setWar(2,a,a!==2)}
 prevPop=[0,0,0,0,0];
 for(let k=0;k<90;k++){const x=r()*W|0,y=r()*H|0;if(type[y*W+x]===GRASS)spawn(4,x,y,-1)}
 document.getElementById('log').innerHTML='';
 log('Новый мир создан. Выбери народ и кликни по суше');
}
function setWar(a,b,v){if(a===b)return;war[a*4+b]=v?1:0;war[b*4+a]=v?1:0}
function atWar(a,b){return war[a*4+b]===1}

function walk(r,t){return(t>=SAND&&t<=HILL)||t===BURNT||(t===SNOW&&RACES[r].hills)}
function spawn(r,x,y,home){if(units.length>=MAXU)return;const R=RACES[r];units.push({r,x,y,dx:x,dy:y,hp:R.hp,age:0,lr:Math.random(),home})}
function move(u){
 const R=RACES[u.r];
 let dx=(Math.random()*3|0)-1,dy=(Math.random()*3|0)-1;
 if(u.home>=0){
  if(owner[u.home]!==u.r)u.home=-1;
  else{const hx=u.home%W,hy=u.home/W|0;if(Math.abs(hx-u.x)+Math.abs(hy-u.y)>7&&Math.random()<.6){dx=Math.sign(hx-u.x);dy=Math.sign(hy-u.y)}}
 }
 const nx=u.x+dx,ny=u.y+dy;if(nx<0||ny<0||nx>=W||ny>=H)return;
 const j=ny*W+nx,t=type[j];
 if(!walk(u.r,t)||fire[j]>0)return;
 if(R.forest&&t!==FOREST&&type[u.y*W+u.x]===FOREST&&Math.random()<.5)return;
 if(t===HILL&&!R.hills&&u.r!==4&&Math.random()<.5)return;
 u.x=nx;u.y=ny;
}

function tick(){
 tickN++;
 head.fill(-1);
 for(let i=0;i<units.length;i++){const u=units[i],k=u.y*W+u.x;nxt[i]=head[k];head[k]=i}
 const sheepCount=pop[4];
 for(let i=0;i<units.length;i++){
  const u=units[i];if(u.hp<=0)continue;
  const R=RACES[u.r];u.age++;
  let k=u.y*W+u.x,t=type[k];
  if(t===LAVA)u.hp-=20;
  if(fire[k]>0&&Math.random()<.4)u.hp-=8;
  if(t<=WATER)u.hp-=3;
  if(u.age>R.age*(.75+u.lr*.5))u.hp=0;
  if(u.hp<=0)continue;
  if(Math.random()<.35)move(u);
  k=u.y*W+u.x;t=type[k];
  if(R.civ){
   let fought=false;
   if(Math.random()<.45){
    outer:for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++){
     const x=u.x+ox,y=u.y+oy;if(x<0||y<0||x>=W||y>=H)continue;
     let j=head[y*W+x];
     while(j!==-1){const v=units[j];
      if(v!==u&&v.hp>0&&v.r!==u.r){
       if(RACES[v.r].civ){if(atWar(u.r,v.r)){v.hp-=R.dmg*(.5+Math.random());fought=true;break outer}}
       else if(Math.random()<.03){v.hp=0;break outer}
      }
      j=nxt[j]}
    }
   }
   const o=owner[k];
   if(o>=0&&o!==u.r&&atWar(u.r,o)&&Math.random()<.03){owner[k]=-1;if(Math.random()<.5)fire[k]=40}
   if(!fought&&o<0&&fire[k]===0&&(t===SAND||t===GRASS||t===BURNT||t===FOREST||(t===HILL&&R.hills))&&Math.random()<.02){
    let own=0,adj=0,enemy=false,anyOwn=-1;
    for(let oy=-5;oy<=5;oy++)for(let ox=-5;ox<=5;ox++){
     const x=u.x+ox,y=u.y+oy;if(x<0||y<0||x>=W||y>=H)continue;
     const q=owner[y*W+x];if(q<0)continue;
     if(ox>=-1&&ox<=1&&oy>=-1&&oy<=1)adj++;
     if(q===u.r){own++;anyOwn=y*W+x}else enemy=true;
    }
    if(u.home<0&&anyOwn>=0)u.home=anyOwn;
    if(adj===0){
     if(own>0&&own<14){build(u,k,t)}
     else if(own===0&&!enemy&&Math.random()<.1){build(u,k,t);if(Math.random()<.15)log(`${R.icon} ${R.name} основали новое поселение`)}
    }
   }
  }else{
   if(t===GRASS&&sheepCount<900&&Math.random()<.004){const x=u.x+(Math.random()*3|0)-1,y=u.y+(Math.random()*3|0)-1;if(x>=0&&y>=0&&x<W&&y<H&&walk(4,type[y*W+x]))spawn(4,x,y,-1)}
  }
 }
 units=units.filter(u=>u.hp>0);
 pop.fill(0);for(const u of units)pop[u.r]++;
 houses.fill(0);
 const ign=[];
 for(let i=0;i<N;i++){
  const o=owner[i];
  if(o>=0){
   houses[o]++;
   if(type[i]<=WATER||type[i]===LAVA){owner[i]=-1}
   else if(Math.random()<.004&&pop[o]<houses[o]*3+4){
    const x=i%W+(Math.random()*3|0)-1,y=(i/W|0)+(Math.random()*3|0)-1;
    if(x>=0&&y>=0&&x<W&&y<H&&walk(o,type[y*W+x])){spawn(o,x,y,i);pop[o]++}
   }
  }
  if(fire[i]>0){
   if(type[i]<=WATER){fire[i]=0;continue}
   fire[i]--;
   if(Math.random()<.15){const j=nb(i);if(j>=0&&fire[j]===0){const p=owner[j]>=0?.5:type[j]===FOREST?.6:type[j]===GRASS?.2:0;if(Math.random()<p)ign.push(j)}}
   if(fire[i]===0){if(type[i]===GRASS||type[i]===FOREST||owner[i]>=0)type[i]=BURNT;owner[i]=-1}
  }
  if(type[i]===LAVA){
   lavaT[i]--;
   const j=nb(i);
   if(j>=0){if(type[j]<=WATER)lavaT[i]-=6;else if(Math.random()<.04&&type[j]!==LAVA&&fire[j]===0)ign.push(j)}
   if(lavaT[i]<=0){type[i]=HILL;hgt[i]=Math.max(hgt[i],.67);lavaT[i]=0}
  }
 }
 for(const j of ign)if(type[j]>WATER&&type[j]!==LAVA)fire[j]=30+(Math.random()*30|0);
 for(let s=0;s<300;s++){
  const i=Math.random()*N|0,t=type[i];
  if(t===BURNT&&fire[i]===0&&Math.random()<.03)type[i]=GRASS;
  else if(t===GRASS&&owner[i]<0&&fire[i]===0){const j=nb(i);if(j>=0&&type[j]===FOREST&&Math.random()<.05)type[i]=FOREST}
 }
 for(let r=0;r<4;r++){if(prevPop[r]>0&&pop[r]===0&&houses[r]===0)log(`${RACES[r].icon} ${RACES[r].name} вымерли`);if(houses[r]===0&&pop[r]===0)prevPop[r]=0;else prevPop[r]=pop[r]}
 if(tickN%700===0)diplomacy();
}
function build(u,k,t){owner[k]=u.r;if(t===FOREST&&!RACES[u.r].forest)type[k]=GRASS;u.home=k}
function nb(i){const x=i%W,y=i/W|0;const d=Math.random()*4|0;const nx=x+(d===0?1:d===1?-1:0),ny=y+(d===2?1:d===3?-1:0);if(nx<0||ny<0||nx>=W||ny>=H)return-1;return ny*W+nx}
function diplomacy(){
 const alive=[0,1,2,3].filter(r=>pop[r]>0);if(alive.length<2)return;
 const a=alive[Math.random()*alive.length|0];let b=alive[Math.random()*alive.length|0];if(a===b)return;
 if(atWar(a,b)){if(Math.random()<(a===2||b===2?.3:.6)){setWar(a,b,false);log(`🕊️ ${RACES[a].name} и ${RACES[b].name.toLowerCase()} заключили мир`)}}
 else if(Math.random()<(a===2||b===2?.8:.4)){setWar(a,b,true);log(`⚔️ ${RACES[a].name} объявили войну ${RACES[b].acc}`)}
}

function brushEach(cx,cy,r,fn){for(let y=Math.max(0,cy-r);y<=Math.min(H-1,cy+r);y++)for(let x=Math.max(0,cx-r);x<=Math.min(W-1,cx+r);x++){const d=Math.hypot(x-cx,y-cy);if(d<=r+.3)fn(y*W+x,x,y,d/(r+.3))}}
function killAt(cx,cy,r){let n=0;for(const u of units)if(Math.hypot(u.x-cx,u.y-cy)<=r){u.hp=0;n++}return n}
function retype(i){if(type[i]===LAVA)return;const old=type[i];let t=classify(hgt[i]);if(t===GRASS&&old===FOREST)t=FOREST;type[i]=t;if(t<=WATER){owner[i]=-1;fire[i]=0}}
let frameN=0;
function applyTool(tx,ty,first){
 const r=brush;
 switch(tool){
  case'raise':brushEach(tx,ty,r,(i,x,y,d)=>{hgt[i]=Math.min(1,hgt[i]+.018*(1-d*.7));retype(i)});break;
  case'lower':brushEach(tx,ty,r,(i,x,y,d)=>{hgt[i]=Math.max(0,hgt[i]-.018*(1-d*.7));retype(i)});break;
  case'forest':brushEach(tx,ty,r,(i)=>{const t=type[i];if((t===GRASS||t===BURNT||t===SAND)&&owner[i]<0&&Math.random()<.25){type[i]=FOREST;fire[i]=0}});break;
  case'rain':brushEach(tx,ty,r+1,(i)=>{fire[i]=0;const t=type[i];if(t===LAVA)lavaT[i]-=20;else if(t===BURNT&&Math.random()<.15)type[i]=GRASS;else if(t===GRASS&&owner[i]<0&&Math.random()<.01)type[i]=FOREST});
   for(let k=0;k<6;k++)effects.push({k:'drop',x:tx+(Math.random()*2-1)*(r+1),y:ty+(Math.random()*2-1)*(r+1)-3,t:0});break;
  case'fire':brushEach(tx,ty,r,(i)=>{if(type[i]>WATER&&type[i]!==LAVA&&Math.random()<.3)fire[i]=40+(Math.random()*20|0)});break;
  case'kill':if(killAt(tx,ty,r)>0)effects.push({k:'ring',x:tx,y:ty,r,t:0,c:'#E97366'});break;
  case'bolt':if(first||frameN%15===0){killAt(tx,ty,1.5);brushEach(tx,ty,1,(i)=>{if(type[i]>WATER&&type[i]!==LAVA)fire[i]=50});effects.push({k:'bolt',x:tx,y:ty,t:0,pts:boltPts()})}break;
  case'meteor':if(first){meteor(tx,ty)}break;
  case'peace':if(first){war.fill(0);log('🕊️ Боги принесли мир всем народам')}break;
  default:if(/^r\d$/.test(tool)){const race=+tool[1];const n=first?3:(frameN%4===0?1:0);
   for(let k=0;k<n;k++){for(let a=0;a<12;a++){const x=tx+Math.round((Math.random()*2-1)*r),y=ty+Math.round((Math.random()*2-1)*r);if(x>=0&&y>=0&&x<W&&y<H&&walk(race,type[y*W+x])){spawn(race,x,y,-1);break}}}}
 }
}
function boltPts(){const p=[];let x=0;for(let k=0;k<=8;k++){p.push(x);x+=(Math.random()*2-1)*1.6}return p}
function meteor(cx,cy){
 const R=Math.max(brush+2,4);
 killAt(cx,cy,R);
 brushEach(cx,cy,R,(i,x,y,d)=>{owner[i]=-1;hgt[i]=Math.max(0,hgt[i]-.14*(1-d));
  if(d<.45&&hgt[i]>.3){type[i]=LAVA;lavaT[i]=250+(Math.random()*200|0);fire[i]=0}else{if(type[i]!==LAVA)retype(i);if(type[i]>WATER&&type[i]!==LAVA&&Math.random()<.6)fire[i]=40}});
 brushEach(cx,cy,R+3,(i,x,y,d)=>{if(d>.75&&type[i]>WATER&&type[i]!==LAVA&&Math.random()<.3)fire[i]=40});
 effects.push({k:'boom',x:cx,y:cy,r:R,t:0});effects.push({k:'flash',t:0});
 shakeT=14;log('☄️ Метеорит упал на землю!');
}

const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
const off=document.createElement('canvas');off.width=W;off.height=H;const octx=off.getContext('2d');const img=octx.createImageData(W,H);
const SPRDATA=[{"rows": ["....kkkk....", "...khhhhk...", "..khhhhhhk..", "..khsssshk..", "..ksesssek..", "..kssssssk..", "...kssssk...", "..kbbbbbbk..", ".kbbbBBbbbk.", ".ksbbbbbbsk.", ".ksbyyyybsk.", "..kbbbbbbk..", "..kppkkppk..", "..kddk.kddk."], "pal": {"k": "#1c1614", "h": "#6e4226", "s": "#eec4a0", "e": "#28283c", "b": "#3e7cd6", "B": "#78b0f0", "y": "#e2ba46", "p": "#464660", "d": "#543826"}}, {"rows": ["............", "....kkkk....", "...kyyyyk...", "..kyyyyyyk..", "kskssssssksk", ".kksesseskk.", "...kssssk...", "..kggggggk..", ".kgggGGgggk.", ".ksggggggsk.", ".kgggbbgggk.", "..kggggggk..", "..kggkkggk..", "..kddk.kddk."], "pal": {"k": "#1c1614", "y": "#f0d678", "s": "#f6d6b8", "e": "#287846", "g": "#3aa05c", "G": "#82dc96", "b": "#8c6032", "d": "#5a4028"}}, {"rows": ["............", "...kkkkkk...", "..koooooook.", "..koeoooeok.", "..koooooook.", "..kowoooowk.", "...kooooook.", ".kkrrrrrrrk.", "kormrrrrmrok", "koorrrrrrook", "kookyyyykook", ".korrrrrrok.", "..krrkkrrk..", "..kddk.kddk."], "pal": {"k": "#1c1614", "o": "#689646", "e": "#f03c28", "w": "#f5f0dc", "r": "#c43a32", "m": "#aaaab0", "y": "#785028", "d": "#3c281e"}}, {"rows": ["............", "....kkkk....", "...kmmmmk...", "..kmmmmmmk..", ".kmmmmmmmmk.", "..kssssssk..", "..ksesesk...", "..knnnnnnk..", ".kbnnnnnnbk.", ".ksbnnnnbsk.", ".kbbyyyybbk.", "..kbbkkbbk..", "..kddk.kddk.", "............"], "pal": {"k": "#1c1614", "m": "#9698a0", "s": "#ecbe96", "e": "#282832", "n": "#d66e28", "b": "#e2a834", "y": "#6e4628", "d": "#463022"}}, {"rows": ["............", "............", "............", "............", "....kkkkk...", "...kwwwwwk..", ".kkwwwwwwwk.", "kffkwwwwwwwk", "kfefwwwwwwwk", ".kffwwwwwwk.", "..kkwwwwwwk.", "...kfk..kfk.", "...kfk..kfk.", "............"], "pal": {"k": "#1c1614", "w": "#f6f4ec", "f": "#3c3432", "e": "#e6e6e6"}}];
const SPR=SPRDATA.map(s=>{const c=document.createElement('canvas');c.width=12;c.height=14;const g=c.getContext('2d');s.rows.forEach((r,y)=>[...r].forEach((ch,x)=>{if(ch!=='.'){g.fillStyle=s.pal[ch];g.fillRect(x,y,1,1)}}));return c});
const SPRURL=SPR.map(c=>c.toDataURL());
const PAL=[[26,60,122],[50,110,188],[226,208,146],[108,170,74],[46,114,58],[134,124,112],[238,242,248],[240,96,32],[70,62,56]];
let S=4,OX=0,OY=0,dpr=1,shakeT=0;
function resize(){const m=document.getElementById('main');dpr=window.devicePixelRatio||1;const w=m.clientWidth,h=m.clientHeight;cvs.width=w*dpr;cvs.height=h*dpr;base=Math.min(w/W,h/H)*dpr;applyCam()}
let base=1,cam={x:W/2,y:H/2,z:2.6};
function applyCam(){cam.z=Math.min(14,Math.max(1,cam.z));S=base*cam.z;const hw=cvs.width/2/S,hh=cvs.height/2/S;cam.x=W<=hw*2?W/2:Math.min(W-hw,Math.max(hw,cam.x));cam.y=H<=hh*2?H/2:Math.min(H-hh,Math.max(hh,cam.y));OX=cvs.width/2-cam.x*S;OY=cvs.height/2-cam.y*S}
window.addEventListener('resize',resize);
function draw(){
 const d=img.data;
 for(let i=0;i<N;i++){
  const t=type[i],c=PAL[t];let r=c[0],g=c[1],b=c[2],s=shade[i];
  if(t===DEEP){const k=Math.min(1,Math.max(0,(.38-hgt[i])*3));r-=k*14;g-=k*30;b-=k*40}
  else if(t===WATER){const k=(hgt[i]-.38)/.07;r+=k*24;g+=k*30;b+=k*14}
  else if(t!==LAVA){const j=i>W?i-W-1:i;s+=(hgt[i]-hgt[j])*7;if(t===HILL)s+=(hgt[i]-.66)*2.5}
  if(t===LAVA){const f=Math.sin(tickN*.15+i*.7)*.5+.5;r=235;g=70+f*80;b=20;s=1}
  if(fire[i]>0){const f=Math.random();r=255;g=110+f*120;b=30+f*30;s=1}
  const p=i*4;d[p]=r*s;d[p+1]=g*s;d[p+2]=b*s;d[p+3]=255;
 }
 octx.putImageData(img,0,0);
 ctx.setTransform(1,0,0,1,0,0);
 ctx.fillStyle='#12284f';ctx.fillRect(0,0,cvs.width,cvs.height);
 let sx=0,sy=0;if(shakeT>0){shakeT--;sx=(Math.random()*2-1)*6*dpr;sy=(Math.random()*2-1)*6*dpr}
 ctx.translate(sx,sy);
 ctx.imageSmoothingEnabled=false;ctx.drawImage(off,OX,OY,W*S,H*S);
 const vx0=Math.max(0,Math.floor(-OX/S)-1),vy0=Math.max(0,Math.floor(-OY/S)-1),vx1=Math.min(W-1,Math.ceil((cvs.width-OX)/S)+1),vy1=Math.min(H-1,Math.ceil((cvs.height-OY)/S)+1);
 for(let ty=vy0;ty<=vy1;ty++)for(let tx=vx0;tx<=vx1;tx++){const i=ty*W+tx;const o=owner[i];if(o<0)continue;const x=OX+tx*S,y=OY+ty*S,c=RACES[o].col;
  ctx.fillStyle='rgb(60,44,34)';ctx.fillRect(x+S*.12,y+S*.3,S*.76,S*.62);
  ctx.fillStyle=`rgb(${c[0]*.85|0},${c[1]*.85|0},${c[2]*.85|0})`;ctx.fillRect(x+S*.04,y+S*.06,S*.92,S*.36)}
 units.sort((a,b)=>a.dy-b.dy);const big=S>=4,h=S*1.8,w=h*12/14;
 for(const u of units){u.dx+=(u.x-u.dx)*.25;u.dy+=(u.y-u.dy)*.25;
  if(u.dx<vx0-2||u.dx>vx1+2||u.dy<vy0-2||u.dy>vy1+2)continue;
  if(big)ctx.drawImage(SPR[u.r],Math.round(OX+(u.dx+.5)*S-w/2),Math.round(OY+(u.dy+1)*S-h),Math.round(w),Math.round(h));
  else{const c=RACES[u.r].col;ctx.fillStyle=`rgb(${c[0]},${c[1]},${c[2]})`;const q=Math.max(1.5*dpr,S);ctx.fillRect(OX+u.dx*S,OY+u.dy*S,q,q)}}
 effects=effects.filter(e=>{e.t++;
  if(e.k==='drop'){e.y+=.5;ctx.strokeStyle='rgba(180,210,255,.8)';ctx.lineWidth=dpr;ctx.beginPath();ctx.moveTo(OX+e.x*S,OY+e.y*S);ctx.lineTo(OX+e.x*S-S*.3,OY+(e.y+1.2)*S);ctx.stroke();return e.t<10}
  if(e.k==='bolt'){ctx.strokeStyle=`rgba(255,255,200,${1-e.t/12})`;ctx.lineWidth=3*dpr;ctx.beginPath();const n=e.pts.length-1;for(let k=0;k<=n;k++){const yy=(e.y+.5)*k/n;const px=OX+(e.x+.5+e.pts[k]*(1-k/n))*S,py=OY+yy*S;k?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.stroke();if(e.t<3){ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(-sx,-sy,cvs.width,cvs.height)}return e.t<12}
  if(e.k==='boom'){const rr=e.r*S*(.5+e.t/20);ctx.strokeStyle=`rgba(255,170,60,${1-e.t/30})`;ctx.lineWidth=4*dpr;ctx.beginPath();ctx.arc(OX+(e.x+.5)*S,OY+(e.y+.5)*S,rr,0,7);ctx.stroke();return e.t<30}
  if(e.k==='flash'){ctx.fillStyle=`rgba(255,230,180,${.6*(1-e.t/10)})`;ctx.fillRect(-sx,-sy,cvs.width,cvs.height);return e.t<10}
  if(e.k==='ring'){ctx.strokeStyle=e.c;ctx.globalAlpha=1-e.t/15;ctx.lineWidth=2*dpr;ctx.beginPath();ctx.arc(OX+(e.x+.5)*S,OY+(e.y+.5)*S,(e.r+.5)*S,0,7);ctx.stroke();ctx.globalAlpha=1;return e.t<15}
  return false});
 if(hover){ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=1.5*dpr;ctx.beginPath();ctx.arc(OX+(hover.x+.5)*S,OY+(hover.y+.5)*S,(brushR()+.5)*S,0,7);ctx.stroke()}
 ctx.setTransform(1,0,0,1,0,0);const mw=Math.round(Math.min(240,cvs.width/dpr*.28)*dpr),mh=Math.round(mw*H/W),mx=cvs.width-mw-16*dpr,my=cvs.height-mh-16*dpr;MM={x:mx,y:my,w:mw,h:mh};
 ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(mx-3*dpr,my-3*dpr,mw+6*dpr,mh+6*dpr);ctx.drawImage(off,mx,my,mw,mh);
 ctx.save();ctx.beginPath();ctx.rect(mx,my,mw,mh);ctx.clip();ctx.strokeStyle='#fff';ctx.lineWidth=2*dpr;ctx.strokeRect(mx+(-OX/S)/W*mw,my+(-OY/S)/H*mh,cvs.width/S/W*mw,cvs.height/S/H*mh);ctx.restore();
}
function brushR(){return tool==='meteor'?Math.max(brush+2,4):tool==='bolt'?1.5:brush}

const toolsEl=document.getElementById('tools'),toolName=document.getElementById('toolName');
TOOLS.forEach(t=>{const b=document.createElement('button');b.className='tool';b.textContent=t.icon;if(/^r\d$/.test(t.id)){b.textContent='';const im=new Image();im.src=SPRURL[+t.id[1]];im.width=24;im.height=28;im.alt='';im.style.imageRendering='pixelated';b.appendChild(im)}b.title=t.name;b.setAttribute('aria-label',t.name);b.onclick=()=>{tool=t.id;updTools()};b.dataset.id=t.id;toolsEl.appendChild(b)});
function updTools(){for(const b of toolsEl.children)b.classList.toggle('active',b.dataset.id===tool);toolName.textContent=TOOLS.find(t=>t.id===tool).name}
updTools();
const brushEl=document.getElementById('brush');brushEl.oninput=()=>{brush=+brushEl.value;document.getElementById('bsv').textContent=brush};
const speedsEl=document.getElementById('speeds');
function setSpeed(s){speed=s;for(const b of speedsEl.children)b.classList.toggle('active',+b.dataset.s===s)}
for(const b of speedsEl.children)b.onclick=()=>setSpeed(+b.dataset.s);
let lastSpeed=1;window.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='INPUT'){e.preventDefault();if(speed){lastSpeed=speed;setSpeed(0)}else setSpeed(lastSpeed)}});
document.getElementById('newWorld').onclick=()=>{genWorld();seedSettlers()};
function log(msg){const el=document.getElementById('log');const d=document.createElement('div');d.textContent=msg;el.appendChild(d);while(el.children.length>5)el.firstChild.remove();setTimeout(()=>d.remove(),7000)}
const statsEl=document.getElementById('stats'),warsEl=document.getElementById('wars'),yearEl=document.getElementById('year');
function updStats(){
 statsEl.innerHTML=RACES.map((R,r)=>`<div class="stat"><span class="dot" style="background:rgb(${R.col})"></span><img src="${SPRURL[r]}" width="15" height="18" alt="" style="image-rendering:pixelated;margin-right:6px">${R.name}<span class="n">${pop[r]}</span><span class="h">${R.civ?'🏠 '+houses[r]:''}</span></div>`).join('');
 const w=[];for(let a=0;a<4;a++)for(let b=a+1;b<4;b++)if(atWar(a,b)&&(pop[a]||houses[a])&&(pop[b]||houses[b]))w.push(`⚔️ ${RACES[a].name} и ${RACES[b].name.toLowerCase()}`);
 warsEl.innerHTML=w.length?w.join('<br>'):'Все живут в мире';
 yearEl.textContent=`Год ${Math.floor(tickN/60)} · жителей ${units.length}`;
}
let pressing=false,first=false,hover=null,pan=null,MM=null,keys={};
function scr(e){const r=cvs.getBoundingClientRect();return{x:(e.clientX-r.left)*dpr,y:(e.clientY-r.top)*dpr}}
function toTile(e){const p=scr(e);return{x:Math.floor((p.x-OX)/S),y:Math.floor((p.y-OY)/S)}}
function inMM(p){return MM&&p.x>=MM.x&&p.y>=MM.y&&p.x<=MM.x+MM.w&&p.y<=MM.y+MM.h}
function mmJump(p){cam.x=(p.x-MM.x)/MM.w*W;cam.y=(p.y-MM.y)/MM.h*H;applyCam()}
cvs.addEventListener('contextmenu',e=>e.preventDefault());
cvs.addEventListener('pointerdown',e=>{cvs.setPointerCapture(e.pointerId);const p=scr(e);
 if(inMM(p)){pan={mm:true};mmJump(p);return}
 if(e.button===1||e.button===2){pan={x:p.x,y:p.y,cx:cam.x,cy:cam.y};return}
 pressing=true;first=true;hover=toTile(e)});
cvs.addEventListener('pointermove',e=>{const p=scr(e);if(pan){if(pan.mm)mmJump(p);else{cam.x=pan.cx-(p.x-pan.x)/S;cam.y=pan.cy-(p.y-pan.y)/S;applyCam()}hover=null;return}hover=inMM(p)?null:toTile(e)});
cvs.addEventListener('pointerup',()=>{pressing=false;pan=null});
cvs.addEventListener('pointercancel',()=>{pressing=false;pan=null});
cvs.addEventListener('wheel',e=>{e.preventDefault();const p=scr(e),wx=(p.x-OX)/S,wy=(p.y-OY)/S;cam.z*=Math.exp(-e.deltaY*.0015);applyCam();cam.x+=wx-(p.x-OX)/S;cam.y+=wy-(p.y-OY)/S;applyCam()},{passive:false});
window.addEventListener('keydown',e=>{keys[e.code]=true});window.addEventListener('keyup',e=>{keys[e.code]=false});window.addEventListener('blur',()=>{keys={}});
cvs.addEventListener('pointerleave',()=>{if(!pressing)hover=null});

const TPF=[0,.5,1,3];
function loop(){
 frameN++;
 {const v=6/cam.z;let mx=0,my=0;if(keys.KeyA||keys.ArrowLeft)mx--;if(keys.KeyD||keys.ArrowRight)mx++;if(keys.KeyW||keys.ArrowUp)my--;if(keys.KeyS||keys.ArrowDown)my++;if(keys.Equal||keys.NumpadAdd)cam.z*=1.03;if(keys.Minus||keys.NumpadSubtract)cam.z/=1.03;if(mx||my||keys.Equal||keys.Minus||keys.NumpadAdd||keys.NumpadSubtract){cam.x+=mx*v;cam.y+=my*v;applyCam()}}
 if(pressing&&hover&&hover.x>=0&&hover.y>=0&&hover.x<W&&hover.y<H){applyTool(hover.x,hover.y,first);first=false}
 acc+=TPF[speed];while(acc>=1){tick();acc--}
 draw();
 if(frameN%15===0)updStats();
 requestAnimationFrame(loop);
}
function seedSettlers(){const spots=[];for(let k=0;k<20000&&spots.length<4;k++){const x=60+Math.random()*(W-120)|0,y=40+Math.random()*(H-80)|0;const t=type[y*W+x];if((t===GRASS||(k>10000&&t===FOREST))&&spots.every(s=>Math.hypot(s.x-x,s.y-y)>(k>14000?60:110)))spots.push({x,y})}
 spots.forEach((s,r)=>{for(let k=0;k<8;k++){const x=s.x+(Math.random()*5|0)-2,y=s.y+(Math.random()*5|0)-2;if(walk(r,type[y*W+x]))spawn(r,x,y,-1)}})}
resize();genWorld();seedSettlers();
if(location.hash==='#warm'){for(let k=0;k<2500;k++)tick()}
updStats();loop();
</script>
